
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遠征アプリ</title>

    <style>
.hidden{
    display:none;
}

.back-button{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
    cursor:pointer;
}

.packing-item{
    padding:10px 0;
    border-bottom:1px solid #ddd;
}
        body{
    font-family:sans-serif;
    margin:0;
    padding:20px;
    background:#ffffff;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    text-align:center;
}

.button-grid{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    margin:30px 0;
}

.button{
    background:#c7f0f2;
    border:3px solid #000;
    border-radius:20px;
    padding:15px;
    min-width:120px;
    text-align:center;
    font-weight:bold;
}

.todo{
    margin-top:30px;
}

.todo-item{
    margin:12px 0;
}

.progress{
    font-size:18px;
    font-weight:bold;
}
.add-button{
    margin:15px 0;
    padding:10px;
    border:2px solid #000;
    border-radius:10px;
    display:inline-block;
    cursor:pointer;
}

.tag{
    font-size:14px;
    margin-left:5px;
}

#packingEdit{
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    background: white;
    padding: 20px;
    border-radius: 12px;

    box-shadow: 0 0 15px rgba(0,0,0,0.3);

    width: 80%;
    max-width: 350px;

    z-index: 1000;
}
        
    </style>
    
</head>

<body>

<div class="header">
<div>NEXT ➜</div>
<div>☰</div>
</div>

<div class="title">
<h1>旅のタイトル</h1>
<div>2026/7/1～7/3</div>
<div>あと14日</div>
</div>

<div class="button-grid">

<div class="button" onclick="openPacking()">
持ち物<br>
<span class="progress">15/18</span>
</div>
    
<div class="button">
お土産<br>
<span class="progress">2/3</span>
</div>

<div class="button">
メモ
</div>

<div class="button">
行きたい場所<br>
5件
</div>

<div class="button">
日程表
</div>

<div class="button">
やること
</div>

</div>

<div class="todo">

<h2>やること</h2>

<div class="todo-item">
☐ 宿予約
</div>

<div class="todo-item">
☐ 美容室予約
</div>

<div class="todo-item">
☐ 服決める
</div>

<div class="todo-item">
☐ ネイル
</div>

</div>

 <div id="packingPage" class="hidden">

<div class="back-button" onclick="closePacking()">
← 戻る
</div>

<h1>持ち物</h1>

<div class="add-button" onclick="addPackingItem()">
＋追加
</div>

<div id="packingList"></div>
<div id="packingEdit" class="hidden">

    <h2>持ち物を編集</h2>

    <p>持ち物名</p>

    <input
       type="text"
       id="packingName"
       placeholder="持ち物名を入力"
       oninput="changePackingName()">

<br>

<label>
    <input type="checkbox" id="packingPinned" onchange="changePackingOptions()">
    📌 ピン止め
</label>

<br>

<label>
    <input type="checkbox" id="packingCarry" onchange="changePackingOptions()">
    ✈️ 機内持ち込み
</label>

<br>

<label>
    <input type="checkbox" id="packingOptional" onchange="changePackingOptions()">
    ⛅ 余裕があれば持っていく
</label>

<br>
    
    <br><br>

    <button onclick="closePackingEdit()">
        閉じる
    </button>

    <br><br>

    <button onclick="deletePackingItem()">
    🗑️ この持ち物を削除
    </button>

</div>
     
<hr>

<div>
✈️ 機内持ち込み
</div>

<div>
⛅ 余裕があれば
</div>

</div>

<script>

function openPacking(){
    loadPacking();
    document.querySelector('.header').style.display='none';
    document.querySelector('.title').style.display='none';
    document.querySelector('.button-grid').style.display='none';
    document.querySelector('.todo').style.display='none';

    document.getElementById('packingPage').classList.remove('hidden');
    renderPacking();
}

function closePacking(){
    document.querySelector('.header').style.display='flex';
    document.querySelector('.title').style.display='block';
    document.querySelector('.button-grid').style.display='flex';
    document.querySelector('.todo').style.display='block';

    document.getElementById('packingPage').classList.add('hidden');
}

    let packingItems = [
    {
    name:"財布",
    carry:false,
    optional:false,
    pinned:false,
    checked:false
    },
    {
        name:"スマホ",
        carry:true,
        optional:false,
        pinned:false,
        checked:false
    },
    {
        name:"着替え",
        carry:false,
        optional:true,
        pinned:false,
        checked:false
    }
];

let editingIndex = -1;
    
function renderPacking(){

    const list = document.getElementById("packingList");

    list.innerHTML = "";

    packingItems.forEach((item,index)=>{

        const mark = item.checked ? "☑" : "☐";

        list.innerHTML += `
        <div class="packing-item">

            <span onclick="openPackingEdit(${index})">
                <span style="font-size:22px;">${mark}</span>
                ${item.name}
            </span>

            <button onclick="togglePinned(${index}); event.stopPropagation();">
                ${item.pinned ? "📌" : "📍"}
            </button>

            <button onclick="toggleCarry(${index}); event.stopPropagation();">
                ${item.carry ? "✈️" : "🛫"}
            </button>

            <button onclick="toggleOptional(${index}); event.stopPropagation();">
                ${item.optional ? "⛅" : "🌤️"}
            </button>

        </div>
        `;
    });
}

function addPackingItem() {

    const name = prompt("持ち物を入力してください");

if (name === null) return;

if (!name.trim()) {
    alert("持ち物名を入力してください");
    return;
}

    packingItems.push({
    name: name,
    carry: false,
    optional: false,
    pinned: false,
    checked: false
    });

    savePacking();
    renderPacking();

}
    
function togglePacking(index){

    packingItems[index].checked =
        !packingItems[index].checked;

    savePacking();

    renderPacking();
}

function toggleCarry(index){

    packingItems[index].carry =
        !packingItems[index].carry;

    savePacking();

    renderPacking();
}

function toggleOptional(index){

    packingItems[index].optional =
        !packingItems[index].optional;

    savePacking();

    renderPacking();
}

function togglePinned(index){

    packingItems[index].pinned =
        !packingItems[index].pinned;

    savePacking();

    renderPacking();
}

function openPackingEdit(index){

    editingIndex = index;

    document.getElementById("packingName").value =
        packingItems[index].name;

    document.getElementById("packingPinned").checked =
        packingItems[index].pinned;

    document.getElementById("packingCarry").checked =
        packingItems[index].carry;

    document.getElementById("packingOptional").checked =
        packingItems[index].optional;
    
    document.getElementById("packingEdit")
        .classList.remove("hidden");

}

function closePackingEdit(){

    document.getElementById("packingEdit")
        .classList.add("hidden");

}

function deletePackingItem(){

    if(editingIndex === -1) return;

    const name = packingItems[editingIndex].name;

    if(!confirm(`「${name}」を削除しますか？`)) return;

    packingItems.splice(editingIndex, 1);

    editingIndex = -1;

    savePacking();
    renderPacking();
    closePackingEdit();
}    

function changePackingName(){

    packingItems[editingIndex].name =
        document.getElementById("packingName").value;

    savePacking();

    renderPacking();

}

function changePackingOptions(){

    if(editingIndex === -1) return;

    packingItems[editingIndex].pinned =
        document.getElementById("packingPinned").checked;

    packingItems[editingIndex].carry =
        document.getElementById("packingCarry").checked;

    packingItems[editingIndex].optional =
        document.getElementById("packingOptional").checked;

    savePacking();
    renderPacking();
}    

function savePacking(){

    localStorage.setItem(
        "packingItems",
        JSON.stringify(packingItems)
    );
}

function loadPacking(){

    const saved =
        localStorage.getItem(
            "packingItems"
        );

    if(saved){
        packingItems =
            JSON.parse(saved);
    }
}

loadPacking();
</script>
    
</body>
</html>
